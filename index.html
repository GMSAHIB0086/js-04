<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>To-Do List</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="todo-container">
    <h1>To-Do List</h1>

    <form id="todoForm" class="input-area">
      <input type="text" id="todoInput" placeholder="Write your task here..." autocomplete="off">
      <button type="submit">Add</button>
    </form>

    <ul id="todoList" class="todo-list"></ul>
    <p id="emptyMessage" class="empty-message">Your tasks will appear here.</p>
  </main>

  <script src="script.js"></script>
</body>
</html>
